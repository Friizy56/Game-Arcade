<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Arcade</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="menu" class="menu active">
        <h1>🎮 Game Arcade</h1>

        <button class="game-btn tictactoe">🎯 Tic Tac Toe (2P)</button>
        <button class="game-btn rps">✊ Rock Paper Scissors (vs Computer)</button>
        <button class="game-btn reaction">⚡ Reaction Test</button>
        <button class="game-btn guess-number">🎲 Guess the Number</button>
        <button class="game-btn disabled">❓ More Games Soon</button>
    </div>

    <div id="game-container"></div>

    <div id="notification-modal" class="notification-modal hidden">
        <div class="notification-box">
            <p id="notification-message"></p>
            <button onclick="closeNotification()" class="notification-btn">OK</button>
        </div>
    </div>

    <script src="games/tictactoe.js"></script>
    <script src="games/rockpaperscissors.js"></script>
    <script src="games/reactiontest.js"></script>
    <script src="games/guessthenumber.js"></script>
    <script src="main.js"></script>
</body>

</html>
